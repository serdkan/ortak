<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container" id="container">
        <article class="card">
            <div class='background'>
                <img src="assets/preview.png" alt="Fetch API GraphQL Preview">
            </div>
            <div class='content'>
                <div class="card-header">
                    <div class="card-type">
                        
                    </div>
                    <div class="latest-article">
                      
                    </div>
                </div>
                <div class="card-content">
                    <h2></h2>
                    <p>
                    </p>
                </div>
                <div class="blog-preview__bottom">
                    <div class="blog-author">
                        <img src="" alt="Avatar">
                        <div class="blog-author__name">
                            <div class="blog-author__name">
                               
                            </div>
                            <a rel="author" href="mailto:david@atheros.ai" class="blog-author__alias">
                                
                            </a>
                        </div>
                    </div>
                    <a class="go-to-article-button" href="/my-blog" title="New Blog">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-arrow-narrow-right"
                            width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M5 12l14 0" />
                            <path d="M15 16l4 -4" />
                            <path d="M15 8l4 4" />
                        </svg>
                    </a>
                </div>
            </div>
        </article>
    </div>

    <script src="./script.js"></script>
</body>

</html>
