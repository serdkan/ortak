<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; 
        }

        .content {
            position: relative;
            z-index: 1;
            color: black; 
            text-align: center;
            padding-top: 200px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            animation: scaleText 20s infinite ease-in-out, colorChange 4s infinite ease-in-out;
        }

     
        @keyframes scaleText {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }

    
        @keyframes colorChange {
            0% {
                color: black;
            }
            25% {
                color: rgb(103, 0, 0);
            }
            50% {
                color: rgb(0, 0, 93);
            }
            75% {
                color: rgb(0, 63, 0);
            }
            100% {
                color: black;
            }
        }
    </style>
</head>
<body>

    <video class="background-video" autoplay muted loop>
        <source src="1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="content">
        <h1>WELCOME TO MY SOFTWARE LIFE</h1>
    </div>

</body>
</html>
