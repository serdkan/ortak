<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body{
            background-image: url(./img/body.jpg);
            background-repeat: no-repeat;
            background-size: 100%;
        }
        .butonlar{
            margin-top: 100px;
        }
        .button {
            background-color: #4CAF50; 
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s; 
            cursor: pointer;
        }

        
        .button:hover {
            background-size: 100px;
            background-color: #45a049; 
            transform: scale(1.05); 
            border-radius: 10%;
            border: black;
        }

        
        .button:active {
            transform: scale(0.95);
        }
        .btn2{
            background-color: red;
            color: yellow;
        }
        .btn2:hover{
            background-size: 100px;
            border-style: solid;
            background-color:  yellow;
            color: red; 
            transform: scale(1.05); 
           border-color: red;
        }
        .btn3{
            background-color: black;
            color: white;
        }
        .btn3:hover{
            background-size: 100px;
            border-style: double;
            border-color: white;
            border-color: black;
            color: black;
            transform: scale(1.05); 
            border-radius: 10%;
        }
    </style>

    <title>LimonStar Bir Dünya Markasıdır!</title>
    <link rel="icon" type="image/x-icon" href="./img/titleicon.jpg">
</head>
<body>
    
<center>
    <div class="butonlar">
        <a href="./Menü Sitesi/index.html"> <button class="button">Menü</button> </a>
        <a href="./Valorant/index.html"><button class="button btn2">Valorant</button></a><br>
        <a href=""><button class="button btn3">Boş çalışma :/</button></a>
    </div>
</center>

</body>
</html>
