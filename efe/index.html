<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brıan O'conner</title>
    <link rel="stylesheet" href="style.css">
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: url('skyl1200.avif') no-repeat ;
    background-size: cover;
    color: #f4f4f9;
}

header {
    background-color: rgba(0, 0, 0, 0.7); 
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

.menu ul {
    list-style-type: none;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.menu ul li {
    margin: 0 20px;
    position: relative;
}

.menu ul li a {
    color: #f4f4f9;
    text-decoration: none;
    padding: 10px 20px;
    font-size: 18px;
    transition: color 0.3s ease, transform 0.3s ease;
    position: relative;
    overflow: hidden;
}

.menu ul li a::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 3px;
    background-color: #61dafb;
    left: 0;
    bottom: -5px;
    transform: scaleX(0);
    transition: transform 0.3s ease;
}

.menu ul li a:hover {
    color: #61dafb;
    transform: scale(1.1);
}

.menu ul li a:hover::after {
    transform: scaleX(1);
}

.menu ul li a.active {
    color: #61dafb;
    font-weight: bold;
}

    </style>
</head>
<body>
    <header>
        <nav class="menu">
            <ul>
                <li><a href="#home">Anasayfa</a></li>
                <li><a href="#Mağaza">Arabalar</a></li>
                <li><a href="#Hakkında">Hakkında</a></li>
                <li><a href="#İletişim">İletişim</a></li>
            </ul>
        </nav>
    </header>
    <script src="script.js" ></script>
</body>
</html>
